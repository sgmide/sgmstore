name: SGM Store - Publish AAB

on:
  repository_dispatch:
    types:
      - aab_uploaded

  workflow_dispatch:

permissions:
  contents: write

jobs:

  publish:

    runs-on: ubuntu-latest

    env:
      KEY_ALIAS: sgmstore

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # JAVA
      # ==========================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # CHECK AAB
      # ==========================================

      - name: Check AAB
        shell: bash
        run: |
          set -e

          if [ ! -f "incoming/app-release.aab" ]; then
            echo "ERROR: incoming/app-release.aab not found"
            exit 1
          fi

          ls -lh incoming/app-release.aab


      # ==========================================
      # GET APP INFORMATION
      # ==========================================

      - name: Get app information
        shell: bash
        run: |
          set -e

          APP_NAME="${{ github.event.client_payload.app_name }}"
          PACKAGE_NAME="${{ github.event.client_payload.package_name }}"

          if [ -z "$APP_NAME" ]; then
            APP_NAME="SGM Store App"
          fi

          if [ -z "$PACKAGE_NAME" ]; then
            echo "ERROR: package_name not supplied"
            exit 1
          fi

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"

          echo "App: $APP_NAME"
          echo "Package: $PACKAGE_NAME"


      # ==========================================
      # CREATE APK FILENAME
      # ==========================================

      - name: Create APK filename
        shell: bash
        run: |
          set -e

          APK_NAME=$(echo "$PACKAGE_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g' \
            | sed 's/^-*//' \
            | sed 's/-*$//')

          if [ -z "$APK_NAME" ]; then
            APK_NAME="app"
          fi

          APK_FILE_NAME="${APK_NAME}.apk"

          echo "APK_FILE_NAME=$APK_FILE_NAME" >> "$GITHUB_ENV"

          echo "APK filename: $APK_FILE_NAME"


      # ==========================================
      # DOWNLOAD BUNDLETOOL
      # ==========================================

      - name: Download bundletool
        shell: bash
        run: |
          set -e

          VERSION="1.18.1"

          curl -L \
            -o bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${VERSION}/bundletool-all-${VERSION}.jar"

          java -jar bundletool.jar version


      # ==========================================
      # CREATE / RESTORE SIGNING KEY
      # ==========================================

      - name: Create or restore SGM Store signing key
        shell: bash
        env:
          MASTER_PASSWORD: ${{ secrets.SGM_MASTER_PASSWORD }}
        run: |
          set -e

          if [ -z "$MASTER_PASSWORD" ]; then
            echo "ERROR: SGM_MASTER_PASSWORD secret is missing"
            exit 1
          fi

          mkdir -p signing

          if [ -f "signing/sgmstore.jks.gpg" ]; then

            echo "Existing SGM Store signing key found."

            gpg \
              --batch \
              --yes \
              --passphrase "$MASTER_PASSWORD" \
              --pinentry-mode loopback \
              --decrypt \
              --output signing/sgmstore.jks \
              signing/sgmstore.jks.gpg

          else

            echo "No signing key found."
            echo "Creating permanent SGM Store signing key..."

            keytool \
              -genkeypair \
              -v \
              -keystore signing/sgmstore.jks \
              -storetype JKS \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$MASTER_PASSWORD" \
              -keypass "$MASTER_PASSWORD" \
              -dname "CN=SGM Store, OU=SGM, O=SGM Store, L=Kannur, ST=Kerala, C=IN"

            gpg \
              --batch \
              --yes \
              --passphrase "$MASTER_PASSWORD" \
              --pinentry-mode loopback \
              --symmetric \
              --cipher-algo AES256 \
              --output signing/sgmstore.jks.gpg \
              signing/sgmstore.jks

            echo "New permanent signing key created."

            rm -f signing/sgmstore.jks

            git config user.name "SGM Store"
            git config user.email "actions@github.com"

            git add signing/sgmstore.jks.gpg

            git commit \
              -m "Initialize SGM Store signing key"

            git push
          fi

          chmod 600 signing/sgmstore.jks


      # ==========================================
      # READ AAB INFORMATION
      # ==========================================

      - name: Read AAB manifest
        shell: bash
        run: |
          set -e

          java -jar bundletool.jar dump manifest \
            --bundle=incoming/app-release.aab \
            > aab-manifest.xml

          cat aab-manifest.xml


      # ==========================================
      # BUILD SIGNED APK SET
      # ==========================================

      - name: Build APK set
        shell: bash
        env:
          MASTER_PASSWORD: ${{ secrets.SGM_MASTER_PASSWORD }}
        run: |
          set -e

          java -jar bundletool.jar build-apks \
            --bundle=incoming/app-release.aab \
            --output=app.apks \
            --ks=signing/sgmstore.jks \
            --ks-key-alias="$KEY_ALIAS" \
            --ks-pass=pass:"$MASTER_PASSWORD" \
            --key-pass=pass:"$MASTER_PASSWORD" \
            --overwrite

          ls -lh app.apks


      # ==========================================
      # EXTRACT APK SET
      # ==========================================

      - name: Extract APKs
        shell: bash
        run: |
          set -e

          rm -rf generated-apks

          mkdir -p generated-apks

          unzip -o app.apks \
            -d generated-apks

          echo "Generated APK files:"

          find generated-apks \
            -type f \
            -name "*.apk" \
            -print


      # ==========================================
      # BUILD UNIVERSAL APK
      # ==========================================

      - name: Build universal APK
        shell: bash
        env:
          MASTER_PASSWORD: ${{ secrets.SGM_MASTER_PASSWORD }}
        run: |
          set -e

          java -jar bundletool.jar build-apks \
            --bundle=incoming/app-release.aab \
            --output=universal.apks \
            --mode=universal \
            --ks=signing/sgmstore.jks \
            --ks-key-alias="$KEY_ALIAS" \
            --ks-pass=pass:"$MASTER_PASSWORD" \
            --key-pass=pass:"$MASTER_PASSWORD" \
            --overwrite

          rm -rf universal

          mkdir -p universal

          unzip -o universal.apks \
            -d universal

          if [ ! -f "universal/universal.apk" ]; then
            echo "ERROR: universal.apk not found"
            exit 1
          fi

          cp \
            universal/universal.apk \
            "$APK_FILE_NAME"

          ls -lh "$APK_FILE_NAME"


      # ==========================================
      # VERIFY APK
      # ==========================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            | sort \
            | tail -1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          "$APKSIGNER" verify \
            --verbose \
            "$APK_FILE_NAME"

          echo "APK signature verified."


      # ==========================================
      # CREATE GITHUB RELEASE
      # ==========================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "sgmstore-${{ github.run_number }}"
          name: "SGM Store - ${{ env.APP_NAME }} - ${{ github.run_number }}"
          generate_release_notes: true

          files: |
            ${{ env.APK_FILE_NAME }}
            app.apks


      # ==========================================
      # CLEANUP
      # ==========================================

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f signing/sgmstore.jks
          rm -f bundletool.jar
          rm -f aab-manifest.xml
          rm -f app.apks
          rm -f universal.apks
          rm -f "$APK_FILE_NAME"
          rm -rf universal
          rm -rf generated-apks
