name: Publish AAB as APK

on:
  push:
    paths:
      - "incoming/*.aab"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # JAVA
      # ==========================================

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # FIND AAB
      # ==========================================

      - name: Find AAB
        id: find_aab
        shell: bash
        run: |

          AAB=$(find incoming -maxdepth 1 -type f -name "*.aab" | head -n 1)

          if [ -z "$AAB" ]; then
            echo "No AAB file found."
            exit 1
          fi

          echo "AAB=$AAB" >> "$GITHUB_OUTPUT"

          echo "Found AAB:"
          echo "$AAB"


      # ==========================================
      # DOWNLOAD BUNDLETOOL
      # ==========================================

      - name: Download bundletool
        shell: bash
        run: |

          curl -fL \
            -o bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar

          if [ ! -s bundletool.jar ]; then
            echo "Failed to download bundletool."
            exit 1
          fi

          java -jar bundletool.jar version


      # ==========================================
      # GET PACKAGE NAME
      # ==========================================

      - name: Get package name
        id: package
        shell: bash
        run: |

          PACKAGE=$(java -jar bundletool.jar dump manifest \
            --bundle="${{ steps.find_aab.outputs.AAB }}" \
            --xpath=/manifest/@package)

          PACKAGE=$(echo "$PACKAGE" | tr -d '\r\n' | xargs)

          if [ -z "$PACKAGE" ]; then
            echo "Could not detect package name."
            exit 1
          fi

          echo "Package: $PACKAGE"

          echo "PACKAGE=$PACKAGE" >> "$GITHUB_OUTPUT"


      # ==========================================
      # GET APPLICATION LABEL
      # ==========================================

      - name: Get application label
        id: app
        shell: bash
        run: |

          LABEL=$(java -jar bundletool.jar dump manifest \
            --bundle="${{ steps.find_aab.outputs.AAB }}" \
            --xpath=/manifest/application/@android:label)

          LABEL=$(echo "$LABEL" | tr -d '\r\n' | xargs)

          echo "Manifest label: $LABEL"

          if [ -z "$LABEL" ]; then
            LABEL="${{ steps.package.outputs.PACKAGE }}"
          fi

          echo "LABEL=$LABEL" >> "$GITHUB_OUTPUT"


      # ==========================================
      # CREATE APK FILENAME
      # PACKAGE NAME BASED
      #
      # com.sgmsoft.nuhameharin
      # ->
      # com-sgmsoft-nuhameharin.apk
      # ==========================================

      - name: Create APK filename
        id: filename
        shell: bash
        run: |

          PACKAGE="${{ steps.package.outputs.PACKAGE }}"

          APK_BASE=$(echo "$PACKAGE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]\+/-/g' \
            | sed 's/^-*//; s/-*$//')

          if [ -z "$APK_BASE" ]; then
            APK_BASE="app"
          fi

          APK_NAME="${APK_BASE}.apk"

          echo "Package: $PACKAGE"
          echo "APK name: $APK_NAME"

          echo "APK_NAME=$APK_NAME" >> "$GITHUB_OUTPUT"


      # ==========================================
      # CREATE SIGNING KEYSTORE
      # ==========================================

      - name: Create signing keystore
        shell: bash
        run: |

          keytool \
            -genkeypair \
            -v \
            -keystore sgmstore-release.jks \
            -storetype JKS \
            -alias sgmstore \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "sgmstore123" \
            -keypass "sgmstore123" \
            -dname "CN=SGM Store, OU=SGM, O=SGM, L=Kannur, ST=Kerala, C=IN"

          if [ ! -f sgmstore-release.jks ]; then
            echo "Keystore creation failed."
            exit 1
          fi

          echo "Keystore created successfully."


      # ==========================================
      # BUILD SIGNED UNIVERSAL APK
      # ==========================================

      - name: Build signed universal APK
        shell: bash
        run: |

          java -jar bundletool.jar build-apks \
            --bundle="${{ steps.find_aab.outputs.AAB }}" \
            --output=app.apks \
            --mode=universal \
            --ks=sgmstore-release.jks \
            --ks-pass=pass:sgmstore123 \
            --ks-key-alias=sgmstore \
            --key-pass=pass:sgmstore123 \
            --overwrite

          if [ ! -f app.apks ]; then
            echo "Failed to create app.apks."
            exit 1
          fi

          echo "Signed APKS created successfully."


      # ==========================================
      # EXTRACT UNIVERSAL APK
      # ==========================================

      - name: Extract APK
        shell: bash
        run: |

          mkdir -p extracted

          unzip -o app.apks \
            "universal.apk" \
            -d extracted

          if [ ! -f extracted/universal.apk ]; then
            echo "universal.apk not found."
            exit 1
          fi

          mv \
            extracted/universal.apk \
            "${{ steps.filename.outputs.APK_NAME }}"

          echo "Generated APK:"
          ls -lh "${{ steps.filename.outputs.APK_NAME }}"


      # ==========================================
      # INSTALL ANDROID BUILD TOOLS
      # ==========================================

      - name: Install Android build tools
        shell: bash
        run: |

          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.0"


      # ==========================================
      # VERIFY APK WITH APKSIGNER
      # ==========================================

      - name: Verify APK signature
        shell: bash
        run: |

          APK="${{ steps.filename.outputs.APK_NAME }}"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -f "$APKSIGNER" ]; then
            echo "apksigner not found."
            exit 1
          fi

          echo "Checking APK signature..."

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          if [ $? -ne 0 ]; then
            echo "APK signature verification failed."
            exit 1
          fi

          echo "APK signature verification successful."


      # ==========================================
      # VERIFY APK ZIP
      # ==========================================

      - name: Verify APK package
        shell: bash
        run: |

          APK="${{ steps.filename.outputs.APK_NAME }}"

          if [ ! -f "$APK" ]; then
            echo "APK file does not exist."
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$APK")

          if [ "$FILE_SIZE" -le 0 ]; then
            echo "APK file is empty."
            exit 1
          fi

          echo "APK size:"
          ls -lh "$APK"

          echo "Checking APK ZIP structure..."

          unzip -t "$APK" > /dev/null

          if [ $? -ne 0 ]; then
            echo "APK ZIP verification failed."
            exit 1
          fi

          echo "APK ZIP verification successful."


      # ==========================================
      # CREATE RELEASE
      # ==========================================

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "store-${{ github.run_number }}"
          name: "${{ steps.app.outputs.LABEL }} ${{ github.run_number }}"
          body: |
            SGM Store APK

            Package: ${{ steps.package.outputs.PACKAGE }}

            APK: ${{ steps.filename.outputs.APK_NAME }}
          generate_release_notes: false
          files: |
            ${{ steps.filename.outputs.APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ==========================================
      # CLEANUP
      # ==========================================

      - name: Cleanup
        if: always()
        shell: bash
        run: |

          rm -f bundletool.jar
          rm -f app.apks
          rm -f sgmstore-release.jks
          rm -rf extracted
