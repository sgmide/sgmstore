name: SGM Store - Build APK from AAB

on:
  repository_dispatch:
    types:
      - aab_uploaded

  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name"
        required: true
        type: string

      app_name:
        description: "App name"
        required: true
        type: string

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # JAVA
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # GET APP INFORMATION
      # ==========================================

      - name: Set app information
        shell: bash
        run: |

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then

            echo "APP_NAME=${{ github.event.client_payload.app_name }}" >> "$GITHUB_ENV"

            echo "PACKAGE_NAME=${{ github.event.client_payload.package_name }}" >> "$GITHUB_ENV"

          else

            echo "APP_NAME=${{ inputs.app_name }}" >> "$GITHUB_ENV"

            echo "PACKAGE_NAME=${{ inputs.package_name }}" >> "$GITHUB_ENV"

          fi

      # ==========================================
      # CHECK AAB
      # ==========================================

      - name: Check AAB
        shell: bash
        run: |

          set -e

          if [ ! -f "incoming/app-release.aab" ]; then
            echo "AAB not found:"
            ls -la incoming || true
            exit 1
          fi

          ls -lh incoming/app-release.aab

      # ==========================================
      # DOWNLOAD BUNDLETOOL
      # ==========================================

      - name: Download bundletool
        shell: bash
        run: |

          set -e

          curl -L \
            -o bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar

          ls -lh bundletool.jar

      # ==========================================
      # CREATE TEMP KEYSTORE
      # ==========================================

      - name: Create signing keystore
        shell: bash
        run: |

          set -e

          keytool \
            -genkeypair \
            -v \
            -keystore store.jks \
            -alias sgmstore \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.SGM_MASTER_PASSWORD }}" \
            -keypass "${{ secrets.SGM_MASTER_PASSWORD }}" \
            -dname "CN=SGM Store, OU=SGM, O=SGM, L=India, ST=Kerala, C=IN"

      # ==========================================
      # CREATE APK SET
      # ==========================================

      - name: Build APK set
        shell: bash
        run: |

          set -e

          java -jar bundletool.jar build-apks \
            --bundle=incoming/app-release.aab \
            --output=app.apks \
            --mode=universal \
            --ks=store.jks \
            --ks-key-alias=sgmstore \
            --ks-pass=pass:"${{ secrets.SGM_MASTER_PASSWORD }}" \
            --key-pass=pass:"${{ secrets.SGM_MASTER_PASSWORD }}"

          ls -lh app.apks

      # ==========================================
      # EXTRACT UNIVERSAL APK
      # ==========================================

      - name: Extract universal APK
        shell: bash
        run: |

          set -e

          rm -rf universal

          mkdir -p universal

          unzip -o \
            app.apks \
            "universal.apk" \
            -d universal

          if [ ! -f "universal/universal.apk" ]; then
            echo "Universal APK not found"
            exit 1
          fi

          ls -lh universal/universal.apk

      # ==========================================
      # CREATE APK FILE NAME
      # ==========================================

      - name: Create APK filename
        shell: bash
        run: |

          set -e

          APK_FILE_NAME=$(echo "$PACKAGE_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g' \
            | sed 's/^-*//' \
            | sed 's/-*$//')

          APK_FILE_NAME="${APK_FILE_NAME}.apk"

          echo "APK_FILE_NAME=$APK_FILE_NAME" >> "$GITHUB_ENV"

          echo "APK filename:"
          echo "$APK_FILE_NAME"

      # ==========================================
      # CREATE UNIQUE RELEASE TAG
      # ==========================================

      - name: Create release tag
        shell: bash
        run: |

          set -e

          RELEASE_TAG=$(echo "$PACKAGE_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g' \
            | sed 's/^-*//' \
            | sed 's/-*$//')

          echo "RELEASE_TAG=app-$RELEASE_TAG" >> "$GITHUB_ENV"

      # ==========================================
      # DELETE OLD RELEASE
      # ==========================================

      - name: Delete old release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          set +e

          gh release delete \
            "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --yes \
            2>/dev/null

          git push \
            --delete origin \
            "$RELEASE_TAG" \
            2>/dev/null

          set -e

      # ==========================================
      # CREATE GITHUB RELEASE
      # ==========================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.APP_NAME }}
          body: |
            SGM Store application

            App: ${{ env.APP_NAME }}
            Package: ${{ env.PACKAGE_NAME }}

          files: |
            universal/universal.apk
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # DONE
      # ==========================================

      - name: Build completed
        shell: bash
        run: |

          echo "=========================================="
          echo "SGM Store build completed"
          echo "=========================================="

          echo "App:"
          echo "$APP_NAME"

          echo "Package:"
          echo "$PACKAGE_NAME"

          echo "APK:"
          echo "$APK_FILE_NAME"

          echo "Release:"
          echo "$RELEASE_TAG"

          echo "Download URL:"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$APK_FILE_NAME"
