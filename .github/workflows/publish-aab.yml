name: SGM Store - Publish AAB

on:

  repository_dispatch:
    types:
      - aab_uploaded

  workflow_dispatch:
    inputs:

      app_name:
        description: "Application name"
        required: true
        type: string

      package_name:
        description: "Application package name"
        required: true
        type: string

      version:
        description: "Application version"
        required: true
        default: "1.0"
        type: string

      description:
        description: "Application description"
        required: false
        type: string

      category:
        description: "Application category"
        required: false
        default: "Application"
        type: string

      privacy_policy:
        description: "Privacy policy URL"
        required: false
        type: string

      ads:
        description: "Contains ads"
        required: false
        default: "No"
        type: string

      whats_new:
        description: "What's new"
        required: false
        type: string

      contact_email:
        description: "Developer contact email"
        required: true
        type: string

      file_size:
        description: "AAB file size"
        required: false
        default: "0"
        type: string


permissions:
  contents: write


jobs:

  publish:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # JAVA
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # ANDROID SDK
      # ==========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================================
      # READ APPLICATION INFORMATION
      # ==========================================================

      - name: Read application information
        shell: bash
        run: |

          set -e

          echo "Reading application information..."

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then

            APP_NAME='${{ github.event.client_payload.app_name }}'
            PACKAGE_NAME='${{ github.event.client_payload.package_name }}'
            VERSION='${{ github.event.client_payload.version }}'
            DESCRIPTION='${{ github.event.client_payload.description }}'

            CATEGORY='${{ github.event.client_payload.category }}'
            PRIVACY_POLICY='${{ github.event.client_payload.privacy_policy }}'
            ADS='${{ github.event.client_payload.ads }}'
            WHATS_NEW='${{ github.event.client_payload.whats_new }}'
            CONTACT_EMAIL='${{ github.event.client_payload.contact_email }}'
            SIZE_BYTES='${{ github.event.client_payload.file_size }}'

          else

            APP_NAME='${{ inputs.app_name }}'
            PACKAGE_NAME='${{ inputs.package_name }}'
            VERSION='${{ inputs.version }}'
            DESCRIPTION='${{ inputs.description }}'

            CATEGORY='${{ inputs.category }}'
            PRIVACY_POLICY='${{ inputs.privacy_policy }}'
            ADS='${{ inputs.ads }}'
            WHATS_NEW='${{ inputs.whats_new }}'
            CONTACT_EMAIL='${{ inputs.contact_email }}'
            SIZE_BYTES='${{ inputs.file_size }}'

          fi


          # ======================================================
          # DEFAULT VALUES
          # ======================================================

          if [ -z "$DESCRIPTION" ]; then
            DESCRIPTION="Application published on SGM Store"
          fi

          if [ -z "$CATEGORY" ]; then
            CATEGORY="Application"
          fi

          if [ -z "$ADS" ]; then
            ADS="No"
          fi

          if [ -z "$VERSION" ]; then
            VERSION="1.0"
          fi


          # ======================================================
          # PACKAGE BASE
          # ======================================================

          PACKAGE_BASE=$(echo "$PACKAGE_NAME" | tr '.' '-')


          APK_FILE_NAME="${PACKAGE_BASE}.apk"

          APKS_FILE_NAME="${PACKAGE_BASE}.apks"

          UNIVERSAL_APKS_FILE_NAME="${PACKAGE_BASE}-universal.apks"

          RELEASE_TAG="app-${PACKAGE_BASE}"


          # ======================================================
          # EXPORT VARIABLES
          # ======================================================

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DESCRIPTION=$DESCRIPTION" >> "$GITHUB_ENV"

          echo "CATEGORY=$CATEGORY" >> "$GITHUB_ENV"
          echo "PRIVACY_POLICY=$PRIVACY_POLICY" >> "$GITHUB_ENV"
          echo "ADS=$ADS" >> "$GITHUB_ENV"
          echo "WHATS_NEW=$WHATS_NEW" >> "$GITHUB_ENV"
          echo "CONTACT_EMAIL=$CONTACT_EMAIL" >> "$GITHUB_ENV"

          echo "SIZE_BYTES=$SIZE_BYTES" >> "$GITHUB_ENV"

          echo "PACKAGE_BASE=$PACKAGE_BASE" >> "$GITHUB_ENV"
          echo "APK_FILE_NAME=$APK_FILE_NAME" >> "$GITHUB_ENV"
          echo "APKS_FILE_NAME=$APKS_FILE_NAME" >> "$GITHUB_ENV"
          echo "UNIVERSAL_APKS_FILE_NAME=$UNIVERSAL_APKS_FILE_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"


          # ======================================================
          # LOG
          # ======================================================

          echo ""
          echo "=========================================="
          echo "SGM STORE APPLICATION"
          echo "=========================================="
          echo "Name: $APP_NAME"
          echo "Package: $PACKAGE_NAME"
          echo "Version: $VERSION"
          echo "Category: $CATEGORY"
          echo "Ads: $ADS"
          echo "Contact: $CONTACT_EMAIL"
          echo "AAB size: $SIZE_BYTES"
          echo "APK: $APK_FILE_NAME"
          echo "APKS: $APKS_FILE_NAME"
          echo "Release: $RELEASE_TAG"
          echo "=========================================="


      # ==========================================================
      # VALIDATE APPLICATION DATA
      # ==========================================================

      - name: Validate application data
        shell: bash
        run: |

          set -e

          if [ -z "$APP_NAME" ]; then
            echo "ERROR: App name is empty"
            exit 1
          fi

          if [ -z "$PACKAGE_NAME" ]; then
            echo "ERROR: Package name is empty"
            exit 1
          fi

          if ! echo "$PACKAGE_NAME" | grep -Eq \
            '^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$'
          then
            echo "ERROR: Invalid package name"
            exit 1
          fi

          if [ -z "$CONTACT_EMAIL" ]; then
            echo "ERROR: Contact email is empty"
            exit 1
          fi

          echo "Application data validated successfully."


      # ==========================================================
      # CHECK AAB
      # ==========================================================

      - name: Check uploaded AAB
        shell: bash
        run: |

          set -e

          AAB_FILE="incoming/app-release.aab"

          if [ ! -f "$AAB_FILE" ]; then

            echo "ERROR:"
            echo "$AAB_FILE not found"

            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort

            exit 1
          fi

          AAB_SIZE=$(stat -c%s "$AAB_FILE")

          echo "AAB found:"
          echo "$AAB_FILE"

          echo "Actual size:"
          echo "$AAB_SIZE bytes"

          if [ "$AAB_SIZE" -le 0 ]; then
            echo "ERROR: AAB file is empty"
            exit 1
          fi


      # ==========================================================
      # DOWNLOAD BUNDLETOOL
      # ==========================================================

      - name: Download bundletool
        shell: bash
        run: |

          set -e

          curl -L \
            -o bundletool.jar \
            "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar"

          if [ ! -f bundletool.jar ]; then
            echo "ERROR: bundletool download failed"
            exit 1
          fi

          ls -lh bundletool.jar


      # ==========================================================
      # PREPARE SIGNING KEY
      # ==========================================================

      - name: Prepare signing key
        env:
          MASTER_PASSWORD: ${{ secrets.SGM_MASTER_PASSWORD }}
        shell: bash
        run: |

          set -e

          if [ -z "$MASTER_PASSWORD" ]; then
            echo "ERROR: SGM_MASTER_PASSWORD secret is not configured."
            exit 1
          fi


          mkdir -p signing

          KEY_FILE="signing/${PACKAGE_BASE}.jks"

          ENCRYPTED_KEY="signing/${PACKAGE_BASE}.jks.gpg"


          # ======================================================
          # EXISTING KEY
          # ======================================================

          if [ -f "$ENCRYPTED_KEY" ]; then

            echo "Existing encrypted signing key found."

            gpg \
              --batch \
              --yes \
              --passphrase "$MASTER_PASSWORD" \
              --pinentry-mode loopback \
              --decrypt \
              --output "$KEY_FILE" \
              "$ENCRYPTED_KEY"

          else

            echo "No signing key found."

            echo "Creating new signing key..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEY_FILE" \
              -storetype JKS \
              -alias sgmstore \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$MASTER_PASSWORD" \
              -keypass "$MASTER_PASSWORD" \
              -dname "CN=SGM Store, OU=SGM, O=SGM, L=India, ST=Kerala, C=IN"


            echo "Encrypting signing key..."

            gpg \
              --batch \
              --yes \
              --pinentry-mode loopback \
              --passphrase "$MASTER_PASSWORD" \
              --symmetric \
              --cipher-algo AES256 \
              --output "$ENCRYPTED_KEY" \
              "$KEY_FILE"

          fi


          if [ ! -f "$KEY_FILE" ]; then
            echo "ERROR: Signing key unavailable"
            exit 1
          fi

          echo "Signing key ready."


      # ==========================================================
      # BUILD APK SET
      # ==========================================================

      - name: Build APK Set
        env:
          MASTER_PASSWORD: ${{ secrets.SGM_MASTER_PASSWORD }}
        shell: bash
        run: |

          set -e

          mkdir -p output

          KEY_FILE="signing/${PACKAGE_BASE}.jks"

          echo "Building APK set..."

          java -Xmx4g \
            -jar bundletool.jar \
            build-apks \
            --bundle="incoming/app-release.aab" \
            --output="output/${APKS_FILE_NAME}" \
            --ks="$KEY_FILE" \
            --ks-key-alias=sgmstore \
            --ks-pass="pass:${MASTER_PASSWORD}" \
            --key-pass="pass:${MASTER_PASSWORD}" \
            --overwrite

          if [ ! -f "output/${APKS_FILE_NAME}" ]; then
            echo "ERROR: APK set was not created"
            exit 1
          fi

          ls -lh "output/${APKS_FILE_NAME}"


      # ==========================================================
      # BUILD UNIVERSAL APK SET
      # ==========================================================

      - name: Build Universal APK
        env:
          MASTER_PASSWORD: ${{ secrets.SGM_MASTER_PASSWORD }}
        shell: bash
        run: |

          set -e

          KEY_FILE="signing/${PACKAGE_BASE}.jks"

          echo "Building universal APK..."

          java -Xmx4g \
            -jar bundletool.jar \
            build-apks \
            --bundle="incoming/app-release.aab" \
            --output="output/${UNIVERSAL_APKS_FILE_NAME}" \
            --mode=universal \
            --ks="$KEY_FILE" \
            --ks-key-alias=sgmstore \
            --ks-pass="pass:${MASTER_PASSWORD}" \
            --key-pass="pass:${MASTER_PASSWORD}" \
            --overwrite

          if [ ! -f "output/${UNIVERSAL_APKS_FILE_NAME}" ]; then
            echo "ERROR: Universal APK set was not created"
            exit 1
          fi

          ls -lh "output/${UNIVERSAL_APKS_FILE_NAME}"


      # ==========================================================
      # EXTRACT UNIVERSAL APK
      # ==========================================================

      - name: Extract Universal APK
        shell: bash
        run: |

          set -e

          mkdir -p output/universal

          unzip -j \
            "output/${UNIVERSAL_APKS_FILE_NAME}" \
            "universal.apk" \
            -d output/universal

          if [ ! -f "output/universal/universal.apk" ]; then
            echo "ERROR: universal.apk not found"
            exit 1
          fi

          mv \
            "output/universal/universal.apk" \
            "output/${APK_FILE_NAME}"

          rm -rf output/universal

          echo "Universal APK:"
          ls -lh "output/${APK_FILE_NAME}"


      # ==========================================================
      # VERIFY APK SET
      # ==========================================================

      - name: Verify APK Set
        shell: bash
        run: |

          set -e

          java -jar bundletool.jar \
            validate \
            --apks="output/${APKS_FILE_NAME}"

          echo "APK set validation successful."


      # ==========================================================
      # VERIFY UNIVERSAL APK
      # ==========================================================

      - name: Verify Universal APK
        shell: bash
        run: |

          set -e

          if [ ! -s "output/${APK_FILE_NAME}" ]; then
            echo "ERROR: APK is missing or empty"
            exit 1
          fi

          echo "Universal APK verified."

          ls -lh "output/${APK_FILE_NAME}"


      # ==========================================================
      # PUBLISH GITHUB RELEASE
      # ==========================================================

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |

          set -e

          APK_FILE="output/${APK_FILE_NAME}"
          APKS_FILE="output/${APKS_FILE_NAME}"


          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then

            echo "Release already exists."

            gh release upload \
              "$RELEASE_TAG" \
              "$APK_FILE" \
              "$APKS_FILE" \
              --clobber

            gh release edit \
              "$RELEASE_TAG" \
              --title "$APP_NAME $VERSION" \
              --notes "SGM Store release for $APP_NAME"

          else

            echo "Creating new release."

            gh release create \
              "$RELEASE_TAG" \
              "$APK_FILE" \
              "$APKS_FILE" \
              --title "$APP_NAME $VERSION" \
              --notes "SGM Store release for $APP_NAME"

          fi


      # ==========================================================
      # UPDATE apps.json
      # ==========================================================

      - name: Update apps.json
        shell: bash
        run: |

          set -e

          python3 <<'PY'

          import json
          import os

          file_path = "apps.json"

          if os.path.exists(file_path):

              try:

                  with open(
                      file_path,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      apps = json.load(f)

                  if not isinstance(apps, list):
                      apps = []

              except Exception:

                  apps = []

          else:

              apps = []


          package_name = os.environ["PACKAGE_NAME"]

          app_name = os.environ["APP_NAME"]

          version = os.environ["VERSION"]

          description = os.environ["DESCRIPTION"]

          category = os.environ["CATEGORY"]

          privacy_policy = os.environ["PRIVACY_POLICY"]

          ads = os.environ["ADS"]

          whats_new = os.environ["WHATS_NEW"]

          contact_email = os.environ["CONTACT_EMAIL"]

          package_base = os.environ["PACKAGE_BASE"]

          release_tag = os.environ["RELEASE_TAG"]


          apk_url = (
              "https://github.com/sgmide/sgmstore/releases/download/"
              + release_tag
              + "/"
              + package_base
              + ".apk"
          )


          apks_url = (
              "https://github.com/sgmide/sgmstore/releases/download/"
              + release_tag
              + "/"
              + package_base
              + ".apks"
          )


          existing = None

          for item in apps:

              if item.get("package") == package_name:

                  existing = item

                  break


          if existing is None:

              existing = {

                  "name": app_name,

                  "package": package_name,

                  "version": version,

                  "description": description,

                  "download": apk_url,

                  "apks": apks_url,

                  "category": category,

                  "privacyPolicy": privacy_policy,

                  "ads": ads,

                  "whatsNew": whats_new,

                  "contactEmail": contact_email,

                  "icon": "",

                  "screenshots": [],

                  "featureGraphic": ""

              }

              apps.append(existing)

          else:

              existing["name"] = app_name

              existing["version"] = version

              existing["description"] = description

              existing["download"] = apk_url

              existing["apks"] = apks_url

              existing["category"] = category

              existing["privacyPolicy"] = privacy_policy

              existing["ads"] = ads

              existing["whatsNew"] = whats_new

              existing["contactEmail"] = contact_email


          with open(
              file_path,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  apps,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

              f.write("\n")


          print("apps.json updated.")

          PY


      # ==========================================================
      # COMMIT CATALOG + SIGNING KEY
      # ==========================================================

      - name: Commit catalog and signing key
        shell: bash
        run: |

          set -e

          git config user.name \
            "SGM Store Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add apps.json

          git add \
            "signing/${PACKAGE_BASE}.jks.gpg"


          if git diff --cached --quiet; then

            echo "No catalog/key changes to commit."

          else

            git commit \
              -m "Update SGM Store app: ${PACKAGE_NAME}"

            git push

          fi


      # ==========================================================
      # CLEANUP
      # ==========================================================

      - name: Cleanup
        if: always()
        shell: bash
        run: |

          rm -f bundletool.jar

          rm -f \
            "signing/${PACKAGE_BASE}.jks"

          rm -rf output

          echo "Cleanup completed."
