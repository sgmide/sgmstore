name: SGM Store - AAB to Signed APK

on:
  repository_dispatch:
    types:
      - aab_uploaded

  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # CHECK MASTER PASSWORD
      # =========================================================

      - name: Check SGM_MASTER_PASSWORD
        shell: bash
        env:
          MASTER_PASSWORD: ${{ secrets.SGM_MASTER_PASSWORD }}
        run: |
          set -e

          if [ -z "$MASTER_PASSWORD" ]; then
            echo "ERROR: SGM_MASTER_PASSWORD is not configured."
            echo
            echo "Go to:"
            echo "Settings -> Secrets and variables -> Actions"
            echo
            echo "Create repository secret:"
            echo "SGM_MASTER_PASSWORD"
            exit 1
          fi

          echo "SGM_MASTER_PASSWORD is available."


      # =========================================================
      # CHECK AAB
      # =========================================================

      - name: Check uploaded AAB
        shell: bash
        run: |
          set -e

          if [ ! -f "incoming/app-release.aab" ]; then
            echo "ERROR: incoming/app-release.aab not found."
            exit 1
          fi

          echo "AAB found:"
          ls -lh incoming/app-release.aab


      # =========================================================
      # DOWNLOAD BUNDLETOOL
      # =========================================================

      - name: Download bundletool
        shell: bash
        run: |
          set -e

          BUNDLETOOL_VERSION="1.18.3"

          curl -fL \
            -o bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"

          test -f bundletool.jar

          echo "bundletool:"
          ls -lh bundletool.jar


      # =========================================================
      # RESTORE OR CREATE PERMANENT KEYSTORE
      #
      # First run:
      #   create JKS
      #   encrypt JKS
      #   commit encrypted JKS
      #
      # Next runs:
      #   decrypt existing JKS
      #   use same signing key
      # =========================================================

      - name: Restore or create permanent signing keystore
        shell: bash
        env:
          MASTER_PASSWORD: ${{ secrets.SGM_MASTER_PASSWORD }}
        run: |
          set -e

          mkdir -p signing

          ENCRYPTED_KEYSTORE="signing/sgmstore.jks.gpg"
          KEYSTORE="signing/sgmstore.jks"

          # -----------------------------------------------------
          # EXISTING ENCRYPTED KEYSTORE
          # -----------------------------------------------------

          if [ -f "$ENCRYPTED_KEYSTORE" ]; then

            echo "Permanent encrypted keystore found."

            gpg \
              --batch \
              --yes \
              --pinentry-mode loopback \
              --passphrase "$MASTER_PASSWORD" \
              --decrypt \
              --output "$KEYSTORE" \
              "$ENCRYPTED_KEYSTORE"

            echo "Permanent keystore restored."

          # -----------------------------------------------------
          # FIRST RUN
          # -----------------------------------------------------

          else

            echo "No permanent keystore found."
            echo "Creating permanent SGM Store signing key..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -alias sgmstore \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$MASTER_PASSWORD" \
              -keypass "$MASTER_PASSWORD" \
              -dname "CN=SGM Store, OU=SGM, O=SGM, L=India, ST=Kerala, C=IN"

            echo "Encrypting permanent keystore..."

            gpg \
              --batch \
              --yes \
              --pinentry-mode loopback \
              --passphrase "$MASTER_PASSWORD" \
              --symmetric \
              --cipher-algo AES256 \
              --output "$ENCRYPTED_KEYSTORE" \
              "$KEYSTORE"

            echo "Encrypted keystore created."

            # ---------------------------------------------------
            # Remove plaintext JKS before git commit
            # ---------------------------------------------------

            rm -f "$KEYSTORE"

            # ---------------------------------------------------
            # Save encrypted keystore permanently in repository
            # ---------------------------------------------------

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add "$ENCRYPTED_KEYSTORE"

            if git diff --cached --quiet; then
              echo "No keystore changes to commit."
            else
              git commit \
                -m "Add encrypted SGM Store signing keystore"

              git push origin HEAD:${GITHUB_REF_NAME}
            fi

            # ---------------------------------------------------
            # Restore plaintext JKS for current build
            # ---------------------------------------------------

            gpg \
              --batch \
              --yes \
              --pinentry-mode loopback \
              --passphrase "$MASTER_PASSWORD" \
              --decrypt \
              --output "$KEYSTORE" \
              "$ENCRYPTED_KEYSTORE"

            echo "Permanent keystore ready."

          fi

          # -----------------------------------------------------
          # Verify keystore
          # -----------------------------------------------------

          if [ ! -f "$KEYSTORE" ]; then
            echo "ERROR: signing keystore is unavailable."
            exit 1
          fi

          keytool \
            -list \
            -keystore "$KEYSTORE" \
            -storepass "$MASTER_PASSWORD" \
            -alias sgmstore

          echo "Signing keystore verified."


      # =========================================================
      # READ PACKAGE NAME FROM AAB
      # =========================================================

      - name: Read package name
        shell: bash
        run: |
          set -e

          java -jar bundletool.jar \
            dump manifest \
            --bundle=incoming/app-release.aab \
            > manifest.xml

          PACKAGE_NAME=$(grep -o 'package="[^"]*"' manifest.xml \
            | head -1 \
            | sed 's/package="//' \
            | sed 's/"//')

          if [ -z "$PACKAGE_NAME" ]; then
            echo "ERROR: Could not detect package name."
            cat manifest.xml
            exit 1
          fi

          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"

          echo "Package:"
          echo "$PACKAGE_NAME"


      # =========================================================
      # CREATE APK FILE NAME
      #
      # com.sgmsoft.android
      # ->
      # com-sgmsoft-android.apk
      # =========================================================

      - name: Create APK filename
        shell: bash
        run: |
          set -e

          APK_FILE_NAME=$(echo "$PACKAGE_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g' \
            | sed 's/^-*//' \
            | sed 's/-*$//')

          if [ -z "$APK_FILE_NAME" ]; then
            echo "ERROR: Invalid APK filename."
            exit 1
          fi

          APK_FILE_NAME="${APK_FILE_NAME}.apk"

          echo "APK_FILE_NAME=$APK_FILE_NAME" >> "$GITHUB_ENV"

          echo "APK:"
          echo "$APK_FILE_NAME"


      # =========================================================
      # CREATE RELEASE TAG
      #
      # com.sgmsoft.android
      # ->
      # app-com-sgmsoft-android
      # =========================================================

      - name: Create release tag
        shell: bash
        run: |
          set -e

          RELEASE_NAME=$(echo "$PACKAGE_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g' \
            | sed 's/^-*//' \
            | sed 's/-*$//')

          if [ -z "$RELEASE_NAME" ]; then
            echo "ERROR: Invalid release tag."
            exit 1
          fi

          RELEASE_TAG="app-${RELEASE_NAME}"

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

          echo "Release:"
          echo "$RELEASE_TAG"


      # =========================================================
      # BUILD SIGNED UNIVERSAL APK
      # =========================================================

      - name: Build signed universal APK
        shell: bash
        env:
          MASTER_PASSWORD: ${{ secrets.SGM_MASTER_PASSWORD }}
        run: |
          set -e

          rm -f app.apks

          java -Xmx4g \
            -jar bundletool.jar \
            build-apks \
            --bundle=incoming/app-release.aab \
            --output=app.apks \
            --mode=universal \
            --ks=signing/sgmstore.jks \
            --ks-key-alias=sgmstore \
            --ks-pass="pass:${MASTER_PASSWORD}" \
            --key-pass="pass:${MASTER_PASSWORD}" \
            --overwrite

          echo "APK set created."

          ls -lh app.apks


      # =========================================================
      # EXTRACT UNIVERSAL APK
      # =========================================================

      - name: Extract universal APK
        shell: bash
        run: |
          set -e

          mkdir -p universal

          unzip -o \
            app.apks \
            universal.apk \
            -d universal

          if [ ! -f "universal/universal.apk" ]; then
            echo "ERROR: universal.apk not found."
            exit 1
          fi

          echo "Universal APK extracted."


      # =========================================================
      # RENAME APK
      # =========================================================

      - name: Rename APK
        shell: bash
        run: |
          set -e

          mv \
            universal/universal.apk \
            "universal/${APK_FILE_NAME}"

          echo "Final APK:"
          ls -lh "universal/${APK_FILE_NAME}"


      # =========================================================
      # VERIFY APK
      # =========================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          keytool \
            -printcert \
            -jarfile "universal/${APK_FILE_NAME}"

          echo "APK signature verified."


      # =========================================================
      # DELETE OLD RELEASE
      # =========================================================

      - name: Delete old release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e

          echo "Deleting old release if it exists..."

          gh release delete \
            "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --yes

          echo "Deleting old tag if it exists..."

          git push \
            --delete origin \
            "$RELEASE_TAG"

          set -e

          echo "Old release cleanup complete."


      # =========================================================
      # CREATE GITHUB RELEASE
      # =========================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.PACKAGE_NAME }}

          body: |
            SGM Store Application

            Package: ${{ env.PACKAGE_NAME }}

            APK generated automatically from the uploaded Android App Bundle.

            Build:
            SGM Store
            GitHub Actions
            bundletool

          files: |
            universal/${{ env.APK_FILE_NAME }}

          make_latest: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # =========================================================
      # CLEAN PLAINTEXT KEYSTORE
      # =========================================================

      - name: Remove plaintext signing key
        if: always()
        shell: bash
        run: |
          rm -f signing/sgmstore.jks
          rm -f app.apks
          rm -f bundletool.jar
          rm -f manifest.xml

          echo "Temporary signing files removed."


      # =========================================================
      # SUCCESS INFORMATION
      # =========================================================

      - name: Show result
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo "        SGM STORE BUILD SUCCESS"
          echo "=============================================="
          echo
          echo "Package:"
          echo "$PACKAGE_NAME"
          echo
          echo "APK:"
          echo "$APK_FILE_NAME"
          echo
          echo "Release tag:"
          echo "$RELEASE_TAG"
          echo
          echo "Download URL:"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_FILE_NAME}"
          echo
          echo "=============================================="
