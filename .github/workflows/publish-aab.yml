name: SGM Store - AAB to Signed APK

on:
repository_dispatch:
types:
- aab_uploaded

workflow_dispatch:

permissions:
contents: write

jobs:

build:

runs-on: ubuntu-latest

steps:

  # ==========================================
  # CHECKOUT
  # ==========================================

  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0


  # ==========================================
  # JAVA 17
  # ==========================================

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'


  # ==========================================
  # CHECK MASTER PASSWORD
  # ==========================================

  - name: Check SGM_MASTER_PASSWORD
    shell: bash
    env:
      MASTER_PASSWORD: ${{ secrets.SGM_MASTER_PASSWORD }}
    run: |

      set -e

      if [ -z "$MASTER_PASSWORD" ]; then

        echo "ERROR: SGM_MASTER_PASSWORD is not configured."

        exit 1

      fi

      echo "SGM_MASTER_PASSWORD is available."


  # ==========================================
  # CHECK AAB
  # ==========================================

  - name: Check uploaded AAB
    shell: bash
    run: |

      set -e

      if [ ! -f "incoming/app-release.aab" ]; then

        echo "ERROR: incoming/app-release.aab not found."

        exit 1

      fi

      ls -lh incoming/app-release.aab


  # ==========================================
  # READ APP INFORMATION
  # ==========================================

  - name: Read app information
    shell: bash
    run: |

      set -e

      APP_NAME="${{ github.event.client_payload.app_name }}"
      PACKAGE_NAME="${{ github.event.client_payload.package_name }}"
      VERSION="${{ github.event.client_payload.version }}"
      DESCRIPTION="${{ github.event.client_payload.description }}"
      SIZE="${{ github.event.client_payload.size }}"

      if [ -z "$APP_NAME" ]; then
        APP_NAME="Unknown App"
      fi

      if [ -z "$PACKAGE_NAME" ]; then

        echo "ERROR: Package name was not provided."

        exit 1

      fi

      if [ -z "$VERSION" ]; then
        VERSION="1.0"
      fi

      if [ -z "$DESCRIPTION" ]; then
        DESCRIPTION="Application published on SGM Store"
      fi

      if [ -z "$SIZE" ]; then
        SIZE="Unknown"
      fi

      echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
      echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"
      echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      echo "DESCRIPTION=$DESCRIPTION" >> "$GITHUB_ENV"
      echo "APP_SIZE=$SIZE" >> "$GITHUB_ENV"

      echo "=============================================="
      echo "APP INFORMATION"
      echo "=============================================="
      echo "Name: $APP_NAME"
      echo "Package: $PACKAGE_NAME"
      echo "Version: $VERSION"
      echo "Size: $SIZE"
      echo "=============================================="


  # ==========================================
  # CREATE APK FILE NAME
  # ==========================================

  - name: Create APK filename
    shell: bash
    run: |

      set -e

      APK_FILE_NAME=$(echo "$PACKAGE_NAME" \
        | tr '[:upper:]' '[:lower:]' \
        | sed 's/[^a-z0-9]/-/g' \
        | sed 's/^-*//' \
        | sed 's/-*$//')

      if [ -z "$APK_FILE_NAME" ]; then

        echo "ERROR: Invalid APK filename."

        exit 1

      fi

      APK_FILE_NAME="${APK_FILE_NAME}.apk"

      echo "APK_FILE_NAME=$APK_FILE_NAME" >> "$GITHUB_ENV"

      echo "APK filename: $APK_FILE_NAME"


  # ==========================================
  # CREATE RELEASE TAG
  # ==========================================

  - name: Create release tag
    shell: bash
    run: |

      set -e

      RELEASE_NAME=$(echo "$PACKAGE_NAME" \
        | tr '[:upper:]' '[:lower:]' \
        | sed 's/[^a-z0-9]/-/g' \
        | sed 's/^-*//' \
        | sed 's/-*$//')

      if [ -z "$RELEASE_NAME" ]; then

        echo "ERROR: Invalid release tag."

        exit 1

      fi

      RELEASE_TAG="app-${RELEASE_NAME}"

      echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      echo "Release tag: $RELEASE_TAG"


  # ==========================================
  # DOWNLOAD BUNDLETOOL
  # ==========================================

  - name: Download bundletool
    shell: bash
    run: |

      set -e

      BUNDLETOOL_VERSION="1.18.3"

      curl -fL \
        -o bundletool.jar \
        "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"

      test -f bundletool.jar

      ls -lh bundletool.jar


  # ==========================================
  # RESTORE OR CREATE PERMANENT KEYSTORE
  # ==========================================

  - name: Restore or create permanent signing keystore
    shell: bash
    env:
      MASTER_PASSWORD: ${{ secrets.SGM_MASTER_PASSWORD }}
    run: |

      set -e

      mkdir -p signing

      ENCRYPTED_KEYSTORE="signing/sgmstore.jks.gpg"
      KEYSTORE="signing/sgmstore.jks"

      # --------------------------------------
      # EXISTING KEYSTORE
      # --------------------------------------

      if [ -f "$ENCRYPTED_KEYSTORE" ]; then

        echo "Permanent encrypted keystore found."

        gpg \
          --batch \
          --yes \
          --pinentry-mode loopback \
          --passphrase "$MASTER_PASSWORD" \
          --decrypt \
          --output "$KEYSTORE" \
          "$ENCRYPTED_KEYSTORE"

        echo "Permanent keystore restored."

      else

        # ----------------------------------
        # CREATE NEW KEYSTORE
        # ----------------------------------

        echo "No permanent keystore found."

        echo "Creating permanent SGM Store signing key..."

        keytool \
          -genkeypair \
          -v \
          -keystore "$KEYSTORE" \
          -alias sgmstore \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass "$MASTER_PASSWORD" \
          -keypass "$MASTER_PASSWORD" \
          -dname "CN=SGM Store, OU=SGM, O=SGM, L=India, ST=Kerala, C=IN"

        # ----------------------------------
        # ENCRYPT KEYSTORE
        # ----------------------------------

        gpg \
          --batch \
          --yes \
          --pinentry-mode loopback \
          --passphrase "$MASTER_PASSWORD" \
          --symmetric \
          --cipher-algo AES256 \
          --output "$ENCRYPTED_KEYSTORE" \
          "$KEYSTORE"

        # ----------------------------------
        # DELETE PLAINTEXT KEYSTORE
        # ----------------------------------

        rm -f "$KEYSTORE"

        # ----------------------------------
        # SAVE ENCRYPTED KEYSTORE
        # ----------------------------------

        git config \
          user.name \
          "github-actions[bot]"

        git config \
          user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"

        git add "$ENCRYPTED_KEYSTORE"

        if git diff --cached --quiet; then

          echo "No keystore changes to commit."

        else

          git commit \
            -m "Add encrypted SGM Store signing keystore"

          git push \
            origin \
            HEAD:${GITHUB_REF_NAME}

        fi

        # ----------------------------------
        # RESTORE FOR CURRENT BUILD
        # ----------------------------------

        gpg \
          --batch \
          --yes \
          --pinentry-mode loopback \
          --passphrase "$MASTER_PASSWORD" \
          --decrypt \
          --output "$KEYSTORE" \
          "$ENCRYPTED_KEYSTORE"

        echo "Permanent keystore ready."

      fi


  # ==========================================
  # VERIFY KEYSTORE
  # ==========================================

  - name: Verify signing keystore
    shell: bash
    env:
      MASTER_PASSWORD: ${{ secrets.SGM_MASTER_PASSWORD }}
    run: |

      set -e

      if [ ! -f "signing/sgmstore.jks" ]; then

        echo "ERROR: signing keystore is unavailable."

        exit 1

      fi

      keytool \
        -list \
        -keystore "signing/sgmstore.jks" \
        -storepass "$MASTER_PASSWORD" \
        -alias sgmstore

      echo "Signing keystore verified."


  # ==========================================
  # BUILD SIGNED UNIVERSAL APK
  # ==========================================

  - name: Build signed universal APK
    shell: bash
    env:
      MASTER_PASSWORD: ${{ secrets.SGM_MASTER_PASSWORD }}
    run: |

      set -e

      rm -f app.apks

      java -Xmx4g \
        -jar bundletool.jar \
        build-apks \
        --bundle=incoming/app-release.aab \
        --output=app.apks \
        --mode=universal \
        --ks=signing/sgmstore.jks \
        --ks-key-alias=sgmstore \
        --ks-pass="pass:${MASTER_PASSWORD}" \
        --key-pass="pass:${MASTER_PASSWORD}" \
        --overwrite

      ls -lh app.apks


  # ==========================================
  # EXTRACT UNIVERSAL APK
  # ==========================================

  - name: Extract universal APK
    shell: bash
    run: |

      set -e

      mkdir -p universal

      unzip \
        -o \
        app.apks \
        universal.apk \
        -d universal

      if [ ! -f "universal/universal.apk" ]; then

        echo "ERROR: universal.apk not found."

        exit 1

      fi


  # ==========================================
  # RENAME APK
  # ==========================================

  - name: Rename APK
    shell: bash
    run: |

      set -e

      mv \
        universal/universal.apk \
        "universal/${APK_FILE_NAME}"

      ls -lh \
        "universal/${APK_FILE_NAME}"


  # ==========================================
  # VERIFY APK SIGNATURE
  # ==========================================

  - name: Verify APK signature
    shell: bash
    run: |

      set -e

      keytool \
        -printcert \
        -jarfile \
        "universal/${APK_FILE_NAME}"

      echo "APK signature verified."


  # ==========================================
  # DELETE OLD RELEASE
  # ==========================================

  - name: Delete old release
    shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    run: |

      set +e

      gh release delete \
        "$RELEASE_TAG" \
        --repo "$GITHUB_REPOSITORY" \
        --yes

      git push \
        --delete \
        origin \
        "$RELEASE_TAG"

      set -e


  # ==========================================
  # CREATE GITHUB RELEASE
  # ==========================================

  - name: Create GitHub Release
    uses: softprops/action-gh-release@v2

    with:

      tag_name: ${{ env.RELEASE_TAG }}

      name: ${{ env.PACKAGE_NAME }}

      body: |
        SGM Store Application

        Application: ${{ env.APP_NAME }}

        Package: ${{ env.PACKAGE_NAME }}

        Version: ${{ env.VERSION }}

        APK generated automatically from the uploaded Android App Bundle.

        Build:
        SGM Store
        GitHub Actions
        bundletool

      files: |
        universal/${{ env.APK_FILE_NAME }}

      make_latest: false

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==========================================
  # UPDATE APPS.JSON
  # ==========================================

  - name: Update apps.json
    shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    run: |

      set -e

      echo "Updating apps.json..."

      APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_FILE_NAME}"

      export APK_URL

      python3 <<'PY'

      import json
      import os
      import base64
      import urllib.request
      import urllib.error

      owner = os.environ["GITHUB_REPOSITORY"].split("/")[0]
      repo = os.environ["GITHUB_REPOSITORY"].split("/")[1]

      token = os.environ["GH_TOKEN"]

      package_name = os.environ["PACKAGE_NAME"]
      app_name = os.environ["APP_NAME"]
      version = os.environ["VERSION"]
      description = os.environ["DESCRIPTION"]
      app_size = os.environ["APP_SIZE"]
      apk_url = os.environ["APK_URL"]

      api_url = (
          "https://api.github.com/repos/"
          + owner
          + "/"
          + repo
          + "/contents/apps.json"
      )

      request = urllib.request.Request(
          api_url,
          headers={
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }
      )

      try:

          with urllib.request.urlopen(request) as response:

              data = json.loads(
                  response.read().decode("utf-8")
              )

          sha = data["sha"]

          content_encoded = data.get("content", "")

          content_encoded = (
              content_encoded
              .replace("\n", "")
              .replace("\r", "")
          )

          if content_encoded:

              apps = json.loads(
                  base64.b64decode(
                      content_encoded
                  ).decode("utf-8")
              )

          else:

              apps = []

      except urllib.error.HTTPError as error:

          if error.code == 404:

              sha = None
              apps = []

          else:

              raise


      if not isinstance(apps, list):

          apps = []


      new_app = {
          "name": app_name,
          "package": package_name,
          "version": version,
          "size": app_size,
          "description": description,
          "apk": apk_url
      }


      replaced = False


      for index in range(len(apps)):

          item = apps[index]

          if not isinstance(item, dict):

              continue

          if item.get("package") == package_name:

              apps[index] = new_app

              replaced = True

              break


      if not replaced:

          apps.append(new_app)


      output = json.dumps(
          apps,
          ensure_ascii=False,
          indent=2
      ) + "\n"


      encoded = base64.b64encode(
          output.encode("utf-8")
      ).decode("ascii")


      payload = {
          "message":
              "Update apps.json: "
              + app_name,

          "content":
              encoded
      }


      if sha:

          payload["sha"] = sha


      body = json.dumps(
          payload
      ).encode("utf-8")


      update_request = urllib.request.Request(
          api_url,
          data=body,
          method="PUT",
          headers={
              "Authorization":
                  "Bearer " + token,

              "Accept":
                  "application/vnd.github+json",

              "Content-Type":
                  "application/json",

              "X-GitHub-Api-Version":
                  "2022-11-28"
          }
      )


      with urllib.request.urlopen(
          update_request
      ) as response:

          response.read()


      print("")
      print("==============================================")
      print("apps.json UPDATED")
      print("==============================================")
      print("App: " + app_name)
      print("Package: " + package_name)
      print("Version: " + version)
      print("APK: " + apk_url)
      print("==============================================")


      PY


  # ==========================================
  # CLEANUP
  # ==========================================

  - name: Remove sensitive build files
    if: always()
    shell: bash
    run: |

      rm -f signing/sgmstore.jks
      rm -f app.apks
      rm -f bundletool.jar


  # ==========================================
  # RESULT
  # ==========================================

  - name: Show result
    shell: bash
    run: |

      echo ""
      echo "=============================================="
      echo "SGM STORE BUILD SUCCESS"
      echo "=============================================="
      echo "Application: $APP_NAME"
      echo "Package: $PACKAGE_NAME"
      echo "Version: $VERSION"
      echo "APK: $APK_FILE_NAME"
      echo "Release tag: $RELEASE_TAG"
      echo ""
      echo "APK URL:"
      echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_FILE_NAME}"
      echo ""
      echo "apps.json updated successfully."
      echo "=============================================="
