name: SGM Store - Build APK Set

on:
  repository_dispatch:
    types:
      - aab_uploaded

  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # JAVA
      # =====================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =====================================================
      # ANDROID SDK
      # =====================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # =====================================================
      # CHECK MASTER PASSWORD
      # =====================================================

      - name: Check signing password
        env:
          MASTER_PASSWORD: ${{ secrets.SGM_MASTER_PASSWORD }}
        run: |
          if [ -z "$MASTER_PASSWORD" ]; then
            echo "SGM_MASTER_PASSWORD secret is missing."
            exit 1
          fi

          echo "Signing password is available."


      # =====================================================
      # CHECK AAB
      # =====================================================

      - name: Check AAB
        run: |

          if [ ! -f "incoming/app-release.aab" ]; then
            echo "ERROR: incoming/app-release.aab not found."
            exit 1
          fi

          echo "AAB found."

          ls -lh incoming/app-release.aab


      # =====================================================
      # READ APP INFORMATION
      # =====================================================

      - name: Read app information
        id: metadata
        env:
          APP_NAME: ${{ github.event.client_payload.app_name }}
          PACKAGE_NAME: ${{ github.event.client_payload.package_name }}
          VERSION: ${{ github.event.client_payload.version }}
          DESCRIPTION: ${{ github.event.client_payload.description }}
          SIZE: ${{ github.event.client_payload.size }}
        run: |

          PACKAGE="$PACKAGE_NAME"

          if [ -z "$PACKAGE" ]; then
            echo "Package name was not supplied."
            exit 1
          fi

          if ! echo "$PACKAGE" | grep -Eq '^[A-Za-z0-9_]+(\.[A-Za-z0-9_]+)+$'; then
            echo "Invalid package name: $PACKAGE"
            exit 1
          fi

          PACKAGE_BASE=$(echo "$PACKAGE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')

          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "package_base=$PACKAGE_BASE" >> "$GITHUB_OUTPUT"

          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "description=$DESCRIPTION" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

          echo "Package: $PACKAGE"
          echo "Package base: $PACKAGE_BASE"


      # =====================================================
      # DOWNLOAD BUNDLETOOL
      # =====================================================

      - name: Download bundletool
        run: |

          curl -L \
            -o bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar

          ls -lh bundletool.jar


      # =====================================================
      # CREATE SIGNING DIRECTORY
      # =====================================================

      - name: Prepare signing directory
        run: |

          mkdir -p signing
          mkdir -p output


      # =====================================================
      # RESTORE / CREATE APP SIGNING KEY
      # =====================================================

      - name: Restore signing key
        env:
          MASTER_PASSWORD: ${{ secrets.SGM_MASTER_PASSWORD }}
        run: |

          PACKAGE_BASE="${{ steps.metadata.outputs.package_base }}"

          ENCRYPTED_KEY="signing/${PACKAGE_BASE}.jks.gpg"
          KEYSTORE="signing/${PACKAGE_BASE}.jks"

          if [ -f "$ENCRYPTED_KEY" ]; then

            echo "Existing signing key found."

            gpg \
              --batch \
              --yes \
              --passphrase "$MASTER_PASSWORD" \
              --pinentry-mode loopback \
              --decrypt \
              --output "$KEYSTORE" \
              "$ENCRYPTED_KEY"

          else

            echo "No signing key found."
            echo "Creating new key..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storetype JKS \
              -alias sgmstore \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$MASTER_PASSWORD" \
              -keypass "$MASTER_PASSWORD" \
              -dname "CN=SGM Store, OU=SGM, O=SGMSoft, L=India, ST=Kerala, C=IN"

            gpg \
              --batch \
              --yes \
              --passphrase "$MASTER_PASSWORD" \
              --pinentry-mode loopback \
              --symmetric \
              --cipher-algo AES256 \
              --output "$ENCRYPTED_KEY" \
              "$KEYSTORE"

            echo "Encrypted signing key created."

            git config user.name "SGM Store Bot"
            git config user.email "actions@github.com"

            git add "$ENCRYPTED_KEY"

            git commit \
              -m "Add signing key for ${PACKAGE_BASE}" \
              || true

            git push || true
          fi

          echo "Signing key ready."


      # =====================================================
      # VERIFY KEYSTORE
      # =====================================================

      - name: Verify signing key
        env:
          MASTER_PASSWORD: ${{ secrets.SGM_MASTER_PASSWORD }}
        run: |

          PACKAGE_BASE="${{ steps.metadata.outputs.package_base }}"

          keytool \
            -list \
            -keystore "signing/${PACKAGE_BASE}.jks" \
            -storepass "$MASTER_PASSWORD"

          echo "Keystore verified."


      # =====================================================
      # BUILD SIGNED APK SET
      #
      # IMPORTANT:
      # NO DEVICE SPEC
      # NO --MODE=UNIVERSAL
      # =====================================================

      - name: Build signed APK Set
        env:
          MASTER_PASSWORD: ${{ secrets.SGM_MASTER_PASSWORD }}
        run: |

          PACKAGE_BASE="${{ steps.metadata.outputs.package_base }}"

          java -Xmx4g \
            -jar bundletool.jar \
            build-apks \
            --bundle="incoming/app-release.aab" \
            --output="output/app.apks" \
            --ks="signing/${PACKAGE_BASE}.jks" \
            --ks-key-alias=sgmstore \
            --ks-pass="pass:${MASTER_PASSWORD}" \
            --key-pass="pass:${MASTER_PASSWORD}" \
            --overwrite

          echo "APK Set created."

          ls -lh output/app.apks


      # =====================================================
      # VERIFY APK SET
      # =====================================================

      - name: Verify APK Set
        run: |

          if [ ! -f "output/app.apks" ]; then
            echo "ERROR: app.apks was not created."
            exit 1
          fi

          unzip -l output/app.apks | head -100

          echo "APK Set verification completed."


      # =====================================================
      # CREATE APP STORAGE DIRECTORY
      # =====================================================

      - name: Create app storage
        run: |

          PACKAGE="${{ steps.metadata.outputs.package }}"

          mkdir -p \
            "sgm-delivery-server/storage/apps/${PACKAGE}"


      # =====================================================
      # COPY APK SET
      # =====================================================

      - name: Copy APK Set
        run: |

          PACKAGE="${{ steps.metadata.outputs.package }}"

          cp \
            output/app.apks \
            "sgm-delivery-server/storage/apps/${PACKAGE}/app.apks"

          ls -lh \
            "sgm-delivery-server/storage/apps/${PACKAGE}/app.apks"


      # =====================================================
      # CREATE app.json
      # =====================================================

      - name: Create app.json
        env:
          APP_NAME: ${{ steps.metadata.outputs.app_name }}
          PACKAGE_NAME: ${{ steps.metadata.outputs.package }}
          VERSION: ${{ steps.metadata.outputs.version }}
          DESCRIPTION: ${{ steps.metadata.outputs.description }}
          SIZE: ${{ steps.metadata.outputs.size }}
        run: |

          PACKAGE="${PACKAGE_NAME}"

          APK_SIZE=$(stat -c%s \
            "sgm-delivery-server/storage/apps/${PACKAGE}/app.apks")

          APK_SIZE_MB=$(awk \
            "BEGIN {printf \"%.2f MB\", ${APK_SIZE}/1024/1024}")

          cat > \
            "sgm-delivery-server/storage/apps/${PACKAGE}/app.json" \
            <<EOF
          {
            "name": "${APP_NAME}",
            "package": "${PACKAGE_NAME}",
            "version": "${VERSION}",
            "description": "${DESCRIPTION}",
            "size": "${APK_SIZE_MB}",
            "size_bytes": ${APK_SIZE},
            "available": true
          }
          EOF

          cat \
            "sgm-delivery-server/storage/apps/${PACKAGE}/app.json"


      # =====================================================
      # UPDATE apps.json
      # Existing package = UPDATE
      # New package = ADD
      # =====================================================

      - name: Update apps.json
        env:
          APP_NAME: ${{ steps.metadata.outputs.app_name }}
          PACKAGE_NAME: ${{ steps.metadata.outputs.package }}
          VERSION: ${{ steps.metadata.outputs.version }}
          DESCRIPTION: ${{ steps.metadata.outputs.description }}
        run: |

          python3 <<'PY'

          import json
          import os

          file = "apps.json"

          app = {
              "name": os.environ.get("APP_NAME", ""),
              "package": os.environ.get("PACKAGE_NAME", ""),
              "version": os.environ.get("VERSION", ""),
              "description": os.environ.get("DESCRIPTION", ""),
              "download": "/v1/apps/" +
                          os.environ.get("PACKAGE_NAME", "") +
                          "/download"
          }

          if os.path.exists(file):

              try:
                  with open(file, "r", encoding="utf-8") as f:
                      apps = json.load(f)

                  if not isinstance(apps, list):
                      apps = []

              except Exception:
                  apps = []

          else:
              apps = []

          found = False

          for i in range(len(apps)):

              if apps[i].get("package") == app["package"]:

                  apps[i] = app
                  found = True
                  break

          if not found:
              apps.append(app)

          with open(file, "w", encoding="utf-8") as f:

              json.dump(
                  apps,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print(json.dumps(
              apps,
              indent=2,
              ensure_ascii=False
          ))

          PY


      # =====================================================
      # SHOW RESULT
      # =====================================================

      - name: Show generated files
        run: |

          echo ""
          echo "=========================================="
          echo "SGM STORE BUILD COMPLETED"
          echo "=========================================="

          PACKAGE="${{ steps.metadata.outputs.package }}"

          echo ""
          echo "Package:"
          echo "$PACKAGE"

          echo ""
          echo "APK Set:"
          ls -lh \
            "sgm-delivery-server/storage/apps/${PACKAGE}/app.apks"

          echo ""
          echo "Metadata:"
          cat \
            "sgm-delivery-server/storage/apps/${PACKAGE}/app.json"

          echo ""
          echo "=========================================="


      # =====================================================
      # COMMIT EVERYTHING
      # =====================================================

      - name: Commit generated app files
        run: |

          PACKAGE="${{ steps.metadata.outputs.package }}"

          git config user.name "SGM Store Bot"
          git config user.email "actions@github.com"

          git add \
            apps.json \
            "sgm-delivery-server/storage/apps/${PACKAGE}/"

          git status

          git diff --cached --stat

          git commit \
            -m "Build ${PACKAGE} APK set" \
            || echo "Nothing to commit."

          git push


      # =====================================================
      # CLEAN PLAINTEXT KEY
      # =====================================================

      - name: Cleanup
        if: always()
        run: |

          rm -f signing/*.jks
          rm -f bundletool.jar
          rm -rf output

          echo "Cleanup completed."
