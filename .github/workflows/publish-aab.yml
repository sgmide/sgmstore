name: SGM Store - Publish AAB

on:

  repository_dispatch:
    types:
      - aab_uploaded

  workflow_dispatch:
    inputs:

      app_name:
        description: "App name"
        required: true
        type: string

      package_name:
        description: "Package name"
        required: true
        type: string

      version:
        description: "App version"
        required: true
        type: string

      description:
        description: "App description"
        required: false
        default: ""
        type: string

permissions:
  contents: write


jobs:

  publish:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # JAVA 17
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # ANDROID SDK
      # ==========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================================
      # READ APP INFORMATION
      # ==========================================================

      - name: Read app information
        shell: bash
        env:
          EVENT_APP_NAME: ${{ github.event.client_payload.app_name }}
          EVENT_PACKAGE_NAME: ${{ github.event.client_payload.package_name }}
          EVENT_VERSION: ${{ github.event.client_payload.version }}
          EVENT_DESCRIPTION: ${{ github.event.client_payload.description }}

          INPUT_APP_NAME: ${{ inputs.app_name }}
          INPUT_PACKAGE_NAME: ${{ inputs.package_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DESCRIPTION: ${{ inputs.description }}

        run: |

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then

            APP_NAME="$EVENT_APP_NAME"
            PACKAGE_NAME="$EVENT_PACKAGE_NAME"
            VERSION="$EVENT_VERSION"
            DESCRIPTION="$EVENT_DESCRIPTION"

          else

            APP_NAME="$INPUT_APP_NAME"
            PACKAGE_NAME="$INPUT_PACKAGE_NAME"
            VERSION="$INPUT_VERSION"
            DESCRIPTION="$INPUT_DESCRIPTION"

          fi


          # ------------------------------------------------------
          # Validate
          # ------------------------------------------------------

          if [ -z "$APP_NAME" ]; then
            echo "ERROR: App name is empty"
            exit 1
          fi


          if [ -z "$PACKAGE_NAME" ]; then
            echo "ERROR: Package name is empty"
            exit 1
          fi


          if [ -z "$VERSION" ]; then
            echo "ERROR: Version is empty"
            exit 1
          fi


          # ------------------------------------------------------
          # Validate Android package name
          # ------------------------------------------------------

          if ! echo "$PACKAGE_NAME" | grep -Eq '^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$'; then

            echo "ERROR: Invalid Android package name:"
            echo "$PACKAGE_NAME"

            exit 1

          fi


          # ------------------------------------------------------
          # Convert package to filename
          #
          # com.sgmsoft.android
          #
          # becomes
          #
          # com-sgmsoft-android
          # ------------------------------------------------------

          PACKAGE_BASE=$(echo "$PACKAGE_NAME" | tr '.' '-')


          # ------------------------------------------------------
          # GitHub Release tag
          # ------------------------------------------------------

          RELEASE_TAG="app-${PACKAGE_BASE}"


          # ------------------------------------------------------
          # APK Set filename
          # ------------------------------------------------------

          APK_FILE_NAME="${PACKAGE_BASE}.apks"


          # ------------------------------------------------------
          # Export variables
          # ------------------------------------------------------

          {
            echo "APP_NAME=$APP_NAME"
            echo "PACKAGE_NAME=$PACKAGE_NAME"
            echo "VERSION=$VERSION"
            echo "DESCRIPTION<<EOF"
            echo "$DESCRIPTION"
            echo "EOF"
            echo "PACKAGE_BASE=$PACKAGE_BASE"
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "APK_FILE_NAME=$APK_FILE_NAME"
          } >> "$GITHUB_ENV"


          echo ""
          echo "======================================"
          echo "App Name     : $APP_NAME"
          echo "Package      : $PACKAGE_NAME"
          echo "Version      : $VERSION"
          echo "Release Tag  : $RELEASE_TAG"
          echo "APK Set      : $APK_FILE_NAME"
          echo "======================================"


      # ==========================================================
      # CHECK AAB
      # ==========================================================

      - name: Check uploaded AAB
        shell: bash
        run: |

          if [ ! -f "incoming/app-release.aab" ]; then

            echo "ERROR: incoming/app-release.aab not found"

            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort

            exit 1

          fi


          echo "AAB found:"
          ls -lh incoming/app-release.aab


      # ==========================================================
      # DOWNLOAD BUNDLETOOL
      # ==========================================================

      - name: Download bundletool
        shell: bash
        run: |

          curl -fL \
            -o bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar


          if [ ! -s "bundletool.jar" ]; then

            echo "ERROR: bundletool download failed"
            exit 1

          fi


          echo "bundletool version:"

          java -jar bundletool.jar version


      # ==========================================================
      # PREPARE SIGNING KEY
      #
      # Required repository secret:
      #
      # SGM_MASTER_PASSWORD
      #
      # Each application has its own encrypted key:
      #
      # signing/
      #   com-sgmsoft-android.jks.gpg
      #   com-sgmsoft-androidaide.jks.gpg
      #
      # ==========================================================

      - name: Prepare signing key
        shell: bash
        env:
          MASTER_PASSWORD: ${{ secrets.SGM_MASTER_PASSWORD }}

        run: |

          if [ -z "$MASTER_PASSWORD" ]; then

            echo "ERROR: SGM_MASTER_PASSWORD secret is missing"

            exit 1

          fi


          mkdir -p signing


          KEY_FILE="signing/${PACKAGE_BASE}.jks"

          ENCRYPTED_KEY="signing/${PACKAGE_BASE}.jks.gpg"


          # ------------------------------------------------------
          # Existing encrypted key
          # ------------------------------------------------------

          if [ -f "$ENCRYPTED_KEY" ]; then

            echo "Existing encrypted signing key found"


            gpg \
              --batch \
              --yes \
              --pinentry-mode loopback \
              --passphrase "$MASTER_PASSWORD" \
              --decrypt \
              --output "$KEY_FILE" \
              "$ENCRYPTED_KEY"


            if [ ! -f "$KEY_FILE" ]; then

              echo "ERROR: Could not decrypt signing key"

              exit 1

            fi


          # ------------------------------------------------------
          # Create new signing key
          # ------------------------------------------------------

          else

            echo "No encrypted signing key found"

            echo "Creating new signing key"


            keytool \
              -genkeypair \
              -v \
              -keystore "$KEY_FILE" \
              -storetype JKS \
              -alias sgmstore \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$MASTER_PASSWORD" \
              -keypass "$MASTER_PASSWORD" \
              -dname "CN=SGM Store, OU=SGM, O=SGM, L=India, ST=Kerala, C=IN"


            echo "Encrypting signing key"


            gpg \
              --batch \
              --yes \
              --pinentry-mode loopback \
              --passphrase "$MASTER_PASSWORD" \
              --symmetric \
              --cipher-algo AES256 \
              --output "$ENCRYPTED_KEY" \
              "$KEY_FILE"


            if [ ! -f "$ENCRYPTED_KEY" ]; then

              echo "ERROR: Signing key encryption failed"

              exit 1

            fi


            echo "Encrypted signing key created"


          fi


          chmod 600 "$KEY_FILE"


      # ==========================================================
      # BUILD APK SET
      #
      # NO --mode=universal
      # NO --device-spec
      #
      # Result:
      #
      # com-sgmsoft-android.apks
      #
      # ==========================================================

      - name: Build APK Set
        shell: bash
        env:
          MASTER_PASSWORD: ${{ secrets.SGM_MASTER_PASSWORD }}

        run: |

          mkdir -p output


          KEY_FILE="signing/${PACKAGE_BASE}.jks"


          echo "Building APK Set..."


          java -Xmx4g \
            -jar bundletool.jar \
            build-apks \
            --bundle="incoming/app-release.aab" \
            --output="output/${APK_FILE_NAME}" \
            --ks="$KEY_FILE" \
            --ks-key-alias=sgmstore \
            --ks-pass="pass:${MASTER_PASSWORD}" \
            --key-pass="pass:${MASTER_PASSWORD}" \
            --overwrite


          if [ ! -f "output/${APK_FILE_NAME}" ]; then

            echo "ERROR: APK Set was not created"

            exit 1

          fi


          echo ""
          echo "APK Set created:"
          ls -lh "output/${APK_FILE_NAME}"


      # ==========================================================
      # VERIFY APK SET
      # ==========================================================

      - name: Verify APK Set
        shell: bash
        run: |

          echo "Testing APK Set archive..."


          unzip -t "output/${APK_FILE_NAME}"


          echo ""
          echo "APK Set verification successful"


      # ==========================================================
      # PUBLISH GITHUB RELEASE
      #
      # Example:
      #
      # Package:
      # com.sgmsoft.android
      #
      # Release:
      # app-com-sgmsoft-android
      #
      # File:
      # com-sgmsoft-android.apks
      #
      # ==========================================================

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          echo "Release tag:"
          echo "$RELEASE_TAG"


          # ------------------------------------------------------
          # Existing release
          # ------------------------------------------------------

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then

            echo "Release already exists"
            echo "Updating existing release"


            gh release upload \
              "$RELEASE_TAG" \
              "output/${APK_FILE_NAME}" \
              --clobber


            gh release edit \
              "$RELEASE_TAG" \
              --title "$APP_NAME $VERSION" \
              --notes "SGM Store package: ${PACKAGE_NAME}"


          # ------------------------------------------------------
          # New release
          # ------------------------------------------------------

          else

            echo "Creating new release"


            gh release create \
              "$RELEASE_TAG" \
              "output/${APK_FILE_NAME}" \
              --title "$APP_NAME $VERSION" \
              --notes "SGM Store package: ${PACKAGE_NAME}"


          fi


          echo ""
          echo "GitHub Release published successfully"


      # ==========================================================
      # UPDATE apps.json
      #
      # GitHub Release URL:
      #
      # https://github.com/sgmide/sgmstore/releases/download/
      # app-com-sgmsoft-android/
      # com-sgmsoft-android.apks
      #
      # ==========================================================

      - name: Update apps.json
        shell: bash
        run: |

          python3 <<'PY'

          import json
          import os


          APPS_FILE = "apps.json"


          app_name = os.environ["APP_NAME"]
          package_name = os.environ["PACKAGE_NAME"]
          version = os.environ["VERSION"]
          description = os.environ["DESCRIPTION"]
          release_tag = os.environ["RELEASE_TAG"]
          apk_file_name = os.environ["APK_FILE_NAME"]
          repository = os.environ["GITHUB_REPOSITORY"]


          # ------------------------------------------------------
          # GitHub Release download URL
          # ------------------------------------------------------

          download_url = (
              "https://github.com/"
              + repository
              + "/releases/download/"
              + release_tag
              + "/"
              + apk_file_name
          )


          print("")
          print("======================================")
          print("GitHub Release URL:")
          print(download_url)
          print("======================================")


          # ------------------------------------------------------
          # Read existing apps.json
          # ------------------------------------------------------

          if os.path.exists(APPS_FILE):

              try:

                  with open(
                      APPS_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      apps = json.load(f)

              except Exception:

                  print("WARNING: Invalid apps.json")
                  print("Creating a new catalog")

                  apps = []

          else:

              print("apps.json does not exist")
              print("Creating new catalog")

              apps = []


          if not isinstance(apps, list):

              apps = []


          # ------------------------------------------------------
          # New app
          # ------------------------------------------------------

          new_app = {

              "name": app_name,

              "package": package_name,

              "version": version,

              "description": description,

              "download": download_url

          }


          # ------------------------------------------------------
          # Find existing package
          # ------------------------------------------------------

          updated = False


          for index in range(len(apps)):

              if apps[index].get("package") == package_name:

                  apps[index] = new_app

                  updated = True

                  print(
                      "Updated existing app:",
                      package_name
                  )

                  break


          # ------------------------------------------------------
          # Add new package
          # ------------------------------------------------------

          if not updated:

              apps.append(new_app)

              print(
                  "Added new app:",
                  package_name
              )


          # ------------------------------------------------------
          # Write apps.json
          # ------------------------------------------------------

          with open(
              APPS_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  apps,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

              f.write("\n")


          print("")
          print("apps.json:")
          print("")


          PY


          cat apps.json


      # ==========================================================
      # SAVE ENCRYPTED SIGNING KEY + apps.json
      #
      # IMPORTANT:
      #
      # The encrypted JKS MUST be committed.
      #
      # Otherwise the next GitHub Actions run creates a new key.
      #
      # ==========================================================

      - name: Commit catalog and signing key
        shell: bash
        run: |

          git config user.name "SGM Store Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add apps.json


          # Add encrypted signing key
          git add "signing/${PACKAGE_BASE}.jks.gpg"


          if git diff --cached --quiet; then

            echo "No repository changes"

          else

            git commit \
              -m "Publish ${PACKAGE_NAME} ${VERSION}"

            git push

          fi


      # ==========================================================
      # CLEANUP
      #
      # Plain JKS is NEVER committed.
      # Only encrypted .gpg remains in repository.
      # ==========================================================

      - name: Cleanup
        if: always()
        shell: bash
        run: |

          rm -f bundletool.jar

          rm -f "signing/${PACKAGE_BASE}.jks"

          rm -rf output

          echo "Cleanup complete"
