name: SGM Store - AAB to Signed APK

on:
  repository_dispatch:
    types:
      - aab_uploaded

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================
      # JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # CHECK MASTER PASSWORD
      # ==========================================

      - name: Check SGM_MASTER_PASSWORD
        shell: bash
        env:
          MASTER_PASSWORD: ${{ secrets.SGM_MASTER_PASSWORD }}
        run: |
          set -e

          if [ -z "$MASTER_PASSWORD" ]; then
            echo "ERROR: SGM_MASTER_PASSWORD is not configured."
            exit 1
          fi

          echo "SGM_MASTER_PASSWORD is available."


      # ==========================================
      # CHECK AAB
      # ==========================================

      - name: Check uploaded AAB
        shell: bash
        run: |
          set -e

          if [ ! -f "incoming/app-release.aab" ]; then
            echo "ERROR: incoming/app-release.aab not found."
            exit 1
          fi

          echo "AAB found:"
          ls -lh incoming/app-release.aab


      # ==========================================
      # READ APP INFORMATION
      # ==========================================

      - name: Read app information
        shell: bash
        env:
          INPUT_APP_NAME: ${{ github.event.client_payload.app_name }}
          INPUT_PACKAGE_NAME: ${{ github.event.client_payload.package_name }}
          INPUT_VERSION: ${{ github.event.client_payload.version }}
          INPUT_DESCRIPTION: ${{ github.event.client_payload.description }}
          INPUT_SIZE: ${{ github.event.client_payload.size }}
        run: |
          set -e

          APP_NAME="$INPUT_APP_NAME"
          PACKAGE_NAME="$INPUT_PACKAGE_NAME"
          VERSION="$INPUT_VERSION"
          DESCRIPTION="$INPUT_DESCRIPTION"
          SIZE="$INPUT_SIZE"

          if [ -z "$APP_NAME" ]; then
            APP_NAME="Unknown App"
          fi

          if [ -z "$PACKAGE_NAME" ]; then
            echo "ERROR: Package name was not provided."
            exit 1
          fi

          if [ -z "$VERSION" ]; then
            VERSION="1.0"
          fi

          if [ -z "$DESCRIPTION" ]; then
            DESCRIPTION="Application published on SGM Store"
          fi

          if [ -z "$SIZE" ]; then
            SIZE="Unknown"
          fi

          printf 'APP_NAME=%s\n' "$APP_NAME" >> "$GITHUB_ENV"
          printf 'PACKAGE_NAME=%s\n' "$PACKAGE_NAME" >> "$GITHUB_ENV"
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
          printf 'APP_SIZE=%s\n' "$SIZE" >> "$GITHUB_ENV"

          {
            echo 'DESCRIPTION<<SGM_DESCRIPTION_EOF'
            printf '%s\n' "$DESCRIPTION"
            echo 'SGM_DESCRIPTION_EOF'
          } >> "$GITHUB_ENV"

          echo "=============================================="
          echo "APP INFORMATION"
          echo "=============================================="
          echo "Name: $APP_NAME"
          echo "Package: $PACKAGE_NAME"
          echo "Version: $VERSION"
          echo "Size: $SIZE"
          echo "Description:"
          echo "$DESCRIPTION"
          echo "=============================================="


      # ==========================================
      # CREATE APK FILE NAME
      # ==========================================

      - name: Create APK filename
        shell: bash
        run: |
          set -e

          APK_BASE_NAME=$(echo "$PACKAGE_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g' \
            | sed 's/^-*//' \
            | sed 's/-*$//')

          if [ -z "$APK_BASE_NAME" ]; then
            echo "ERROR: Invalid APK filename."
            exit 1
          fi

          APK_FILE_NAME="${APK_BASE_NAME}.apk"

          echo "APK_FILE_NAME=$APK_FILE_NAME" >> "$GITHUB_ENV"

          echo "APK filename: $APK_FILE_NAME"


      # ==========================================
      # CREATE RELEASE TAG
      # ==========================================

      - name: Create release tag
        shell: bash
        run: |
          set -e

          RELEASE_NAME=$(echo "$PACKAGE_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g' \
            | sed 's/^-*//' \
            | sed 's/-*$//')

          if [ -z "$RELEASE_NAME" ]; then
            echo "ERROR: Invalid release tag."
            exit 1
          fi

          RELEASE_TAG="app-${RELEASE_NAME}"

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

          echo "Release tag: $RELEASE_TAG"


      # ==========================================
      # DOWNLOAD BUNDLETOOL
      # ==========================================

      - name: Download bundletool
        shell: bash
        run: |
          set -e

          BUNDLETOOL_VERSION="1.18.3"

          curl -fL \
            -o bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"

          if [ ! -f "bundletool.jar" ]; then
            echo "ERROR: bundletool.jar download failed."
            exit 1
          fi

          ls -lh bundletool.jar


      # ==========================================
      # RESTORE OR CREATE PERMANENT KEYSTORE
      # ==========================================

      - name: Restore or create permanent signing keystore
        shell: bash
        env:
          MASTER_PASSWORD: ${{ secrets.SGM_MASTER_PASSWORD }}
        run: |
          set -e

          mkdir -p signing

          ENCRYPTED_KEYSTORE="signing/sgmstore.jks.gpg"
          KEYSTORE="signing/sgmstore.jks"

          if [ -f "$ENCRYPTED_KEYSTORE" ]; then

            echo "Permanent encrypted keystore found."

            gpg \
              --batch \
              --yes \
              --pinentry-mode loopback \
              --passphrase "$MASTER_PASSWORD" \
              --decrypt \
              --output "$KEYSTORE" \
              "$ENCRYPTED_KEYSTORE"

            echo "Permanent keystore restored."

          else

            echo "No permanent keystore found."
            echo "Creating permanent SGM Store signing key..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -alias sgmstore \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$MASTER_PASSWORD" \
              -keypass "$MASTER_PASSWORD" \
              -dname "CN=SGM Store, OU=SGM, O=SGM, L=India, ST=Kerala, C=IN"

            echo "Keystore created."

            gpg \
              --batch \
              --yes \
              --pinentry-mode loopback \
              --passphrase "$MASTER_PASSWORD" \
              --symmetric \
              --cipher-algo AES256 \
              --output "$ENCRYPTED_KEYSTORE" \
              "$KEYSTORE"

            echo "Keystore encrypted."

            rm -f "$KEYSTORE"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add "$ENCRYPTED_KEYSTORE"

            if git diff --cached --quiet; then

              echo "No keystore changes to commit."

            else

              git commit \
                -m "Add encrypted SGM Store signing keystore"

              git push \
                origin \
                HEAD:${GITHUB_REF_NAME}

            fi

            gpg \
              --batch \
              --yes \
              --pinentry-mode loopback \
              --passphrase "$MASTER_PASSWORD" \
              --decrypt \
              --output "$KEYSTORE" \
              "$ENCRYPTED_KEYSTORE"

            echo "Permanent keystore ready."

          fi


      # ==========================================
      # VERIFY KEYSTORE
      # ==========================================

      - name: Verify signing keystore
        shell: bash
        env:
          MASTER_PASSWORD: ${{ secrets.SGM_MASTER_PASSWORD }}
        run: |
          set -e

          if [ ! -f "signing/sgmstore.jks" ]; then
            echo "ERROR: signing keystore is unavailable."
            exit 1
          fi

          keytool \
            -list \
            -keystore "signing/sgmstore.jks" \
            -storepass "$MASTER_PASSWORD" \
            -alias sgmstore

          echo "Signing keystore verified."


      # ==========================================
      # BUILD SIGNED UNIVERSAL APK
      # ==========================================

      - name: Build signed universal APK
        shell: bash
        env:
          MASTER_PASSWORD: ${{ secrets.SGM_MASTER_PASSWORD }}
        run: |
          set -e

          rm -f app.apks

          java -Xmx4g \
            -jar bundletool.jar \
            build-apks \
            --bundle=incoming/app-release.aab \
            --output=app.apks \
            --mode=universal \
            --ks=signing/sgmstore.jks \
            --ks-key-alias=sgmstore \
            --ks-pass="pass:${MASTER_PASSWORD}" \
            --key-pass="pass:${MASTER_PASSWORD}" \
            --overwrite

          if [ ! -f "app.apks" ]; then
            echo "ERROR: app.apks was not created."
            exit 1
          fi

          ls -lh app.apks


      # ==========================================
      # EXTRACT UNIVERSAL APK
      # ==========================================

      - name: Extract universal APK
        shell: bash
        run: |
          set -e

          rm -rf universal
          mkdir -p universal

          unzip \
            -o \
            app.apks \
            universal.apk \
            -d universal

          if [ ! -f "universal/universal.apk" ]; then
            echo "ERROR: universal.apk not found."
            exit 1
          fi

          echo "Universal APK extracted."


      # ==========================================
      # RENAME APK
      # ==========================================

      - name: Rename APK
        shell: bash
        run: |
          set -e

          mv \
            universal/universal.apk \
            "universal/${APK_FILE_NAME}"

          ls -lh "universal/${APK_FILE_NAME}"


      # ==========================================
      # VERIFY APK SIGNATURE
      # ==========================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          keytool \
            -printcert \
            -jarfile \
            "universal/${APK_FILE_NAME}"

          echo "APK signature verified."


      # ==========================================
      # DELETE OLD RELEASE
      # ==========================================

      - name: Delete old release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e

          gh release delete \
            "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --yes

          git push \
            --delete \
            origin \
            "$RELEASE_TAG"

          set -e

          echo "Old release cleanup completed."


      # ==========================================
      # CREATE GITHUB RELEASE
      # ==========================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}

          name: ${{ env.PACKAGE_NAME }}

          body: |
            SGM Store Application

            Application: ${{ env.APP_NAME }}

            Package: ${{ env.PACKAGE_NAME }}

            Version: ${{ env.VERSION }}

            APK generated automatically from the uploaded Android App Bundle.

            Build:
            SGM Store
            GitHub Actions
            bundletool

          files: |
            universal/${{ env.APK_FILE_NAME }}

          make_latest: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ==========================================
      # CREATE OR UPDATE APPS.JSON
      # ==========================================

      - name: Create or update apps.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "=============================================="
          echo "CREATE / UPDATE apps.json"
          echo "=============================================="

          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_FILE_NAME}"

          export APK_URL

          python3 <<'PY'
          import json
          import os
          import base64
          import urllib.request
          import urllib.error

          # ==========================================
          # REPOSITORY
          # ==========================================

          repository = os.environ["GITHUB_REPOSITORY"]

          owner, repo = repository.split("/", 1)

          token = os.environ["GH_TOKEN"]

          # ==========================================
          # APP DATA
          # ==========================================

          package_name = os.environ["PACKAGE_NAME"]
          app_name = os.environ["APP_NAME"]
          version = os.environ["VERSION"]
          description = os.environ["DESCRIPTION"]
          app_size = os.environ["APP_SIZE"]
          apk_url = os.environ["APK_URL"]

          api_url = (
              "https://api.github.com/repos/"
              + owner
              + "/"
              + repo
              + "/contents/apps.json"
          )

          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          # ==========================================
          # READ apps.json
          # ==========================================

          sha = None
          apps = []

          get_request = urllib.request.Request(
              api_url,
              headers=headers
          )

          try:

              with urllib.request.urlopen(get_request) as response:

                  data = json.loads(
                      response.read().decode("utf-8")
                  )

              sha = data.get("sha")

              encoded_content = data.get(
                  "content",
                  ""
              )

              encoded_content = (
                  encoded_content
                  .replace("\n", "")
                  .replace("\r", "")
              )

              if encoded_content:

                  decoded_content = base64.b64decode(
                      encoded_content
                  ).decode("utf-8")

                  if decoded_content.strip():

                      apps = json.loads(
                          decoded_content
                      )

                  else:

                      apps = []

              else:

                  apps = []

              print("Existing apps.json found.")

          except urllib.error.HTTPError as error:

              if error.code == 404:

                  print("apps.json NOT FOUND.")
                  print("A new apps.json will be created.")

                  sha = None
                  apps = []

              else:

                  print("ERROR reading apps.json.")

                  error_body = error.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print(error_body)

                  raise


          # ==========================================
          # VALIDATE EXISTING DATA
          # ==========================================

          if not isinstance(apps, list):

              print(
                  "Existing apps.json is invalid."
              )

              print(
                  "Creating a new JSON array."
              )

              apps = []


          # ==========================================
          # NEW APP OBJECT
          # ==========================================

          new_app = {
              "name": app_name,
              "package": package_name,
              "version": version,
              "size": app_size,
              "description": description,
              "apk": apk_url
          }


          # ==========================================
          # FIND SAME PACKAGE
          # ==========================================

          replaced = False

          for index in range(len(apps)):

              item = apps[index]

              if not isinstance(item, dict):
                  continue

              if item.get("package") == package_name:

                  print("")
                  print(
                      "Existing package found:"
                  )
                  print(package_name)
                  print(
                      "Replacing old entry..."
                  )

                  apps[index] = new_app

                  replaced = True

                  break


          # ==========================================
          # ADD NEW PACKAGE
          # ==========================================

          if not replaced:

              print("")
              print(
                  "Package not found."
              )
              print(
                  "Adding new app entry:"
              )
              print(package_name)

              apps.append(new_app)


          # ==========================================
          # CREATE JSON
          # ==========================================

          output = json.dumps(
              apps,
              ensure_ascii=False,
              indent=2
          ) + "\n"


          encoded = base64.b64encode(
              output.encode("utf-8")
          ).decode("ascii")


          # ==========================================
          # CREATE GITHUB API PAYLOAD
          # ==========================================

          payload = {
              "message":
                  "Create/update apps.json - "
                  + app_name,

              "content":
                  encoded
          }


          # ==========================================
          # IF FILE EXISTS
          # SEND SHA
          # ==========================================

          if sha:

              payload["sha"] = sha


          body = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")


          # ==========================================
          # CREATE OR UPDATE apps.json
          # ==========================================

          update_headers = {
              "Authorization":
                  "Bearer " + token,

              "Accept":
                  "application/vnd.github+json",

              "Content-Type":
                  "application/json",

              "X-GitHub-Api-Version":
                  "2022-11-28"
          }


          update_request = urllib.request.Request(
              api_url,
              data=body,
              method="PUT",
              headers=update_headers
          )


          try:

              with urllib.request.urlopen(
                  update_request
              ) as response:

                  result = json.loads(
                      response.read().decode("utf-8")
                  )


              print("")
              print("==============================================")

              if sha:

                  print(
                      "apps.json UPDATED SUCCESSFULLY"
                  )

              else:

                  print(
                      "apps.json CREATED SUCCESSFULLY"
                  )

              print("==============================================")
              print("Application : " + app_name)
              print("Package     : " + package_name)
              print("Version     : " + version)
              print("Size        : " + app_size)
              print("APK         : " + apk_url)
              print("==============================================")


              if "content" in result:

                  print(
                      "GitHub Contents API confirmed."
                  )


          except urllib.error.HTTPError as error:

              print("")
              print(
                  "=============================================="
              )
              print(
                  "ERROR: apps.json CREATE/UPDATE FAILED"
              )
              print(
                  "=============================================="
              )

              error_body = error.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print(error_body)

              print(
                  "=============================================="
              )

              raise

          PY


      # ==========================================
      # CLEANUP
      # ==========================================

      - name: Remove sensitive build files
        if: always()
        shell: bash
        run: |
          rm -f signing/sgmstore.jks
          rm -f app.apks
          rm -f bundletool.jar
          rm -rf universal


      # ==========================================
      # RESULT
      # ==========================================

      - name: Show result
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "SGM STORE BUILD SUCCESS"
          echo "=============================================="
          echo "Application: $APP_NAME"
          echo "Package: $PACKAGE_NAME"
          echo "Version: $VERSION"
          echo "APK: $APK_FILE_NAME"
          echo "Release tag: $RELEASE_TAG"
          echo ""
          echo "APK URL:"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_FILE_NAME}"
          echo ""
          echo "apps.json created or updated successfully."
          echo "=============================================="
