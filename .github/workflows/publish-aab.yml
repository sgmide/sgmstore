name: Publish AAB

on:
  push:
    paths:
      - "incoming/*.aab"
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Build Tools
        run: |
          sdkmanager "build-tools;35.0.0"

      - name: Find AAB
        id: find
        shell: bash
        run: |

          AAB=$(find incoming -maxdepth 1 -type f -name "*.aab" | head -n 1)

          if [ -z "$AAB" ]; then
            echo "No AAB found."
            exit 1
          fi

          echo "AAB=$AAB" >> "$GITHUB_OUTPUT"

      - name: Download bundletool
        run: |

          curl -fL \
            -o bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar

          java -jar bundletool.jar version

      - name: Get Package
        id: package
        shell: bash
        run: |

          PACKAGE=$(java -jar bundletool.jar dump manifest \
            --bundle="${{ steps.find.outputs.AAB }}" \
            --xpath=/manifest/@package)

          PACKAGE=$(echo "$PACKAGE" | tr -d '\r\n' | xargs)

          if [ -z "$PACKAGE" ]; then
            echo "Package not found."
            exit 1
          fi

          echo "PACKAGE=$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Get App Name
        id: app
        shell: bash
        run: |

          LABEL=$(java -jar bundletool.jar dump manifest \
            --bundle="${{ steps.find.outputs.AAB }}" \
            --xpath=/manifest/application/@android:label)

          LABEL=$(echo "$LABEL" | tr -d '\r\n' | xargs)

          if [[ "$LABEL" == @* ]] || [ -z "$LABEL" ]; then
            LABEL="${{ steps.package.outputs.PACKAGE }}"
          fi

          echo "LABEL=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Create APK name
        id: filename
        shell: bash
        run: |

          NAME="${{ steps.app.outputs.LABEL }}"

          NAME=$(echo "$NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9][^a-z0-9]*/-/g' \
            | sed 's/^-*//;s/-*$//')

          if [ -z "$NAME" ]; then
            NAME="${{ steps.package.outputs.PACKAGE }}"
          fi

          echo "APK_NAME=${NAME}.apk" >> "$GITHUB_OUTPUT"

      - name: Decode signing key
        shell: bash
        run: |

          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "${{ secrets.KEYSTORE_BASE64 }}" \
            | base64 --decode > release.jks

          test -s release.jks

      - name: Build APK set
        run: |

          java -jar bundletool.jar build-apks \
            --bundle="${{ steps.find.outputs.AAB }}" \
            --output=app.apks \
            --mode=universal \
            --ks=release.jks \
            --ks-pass="pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias="${{ secrets.KEY_ALIAS }}" \
            --key-pass="pass:${{ secrets.KEY_PASSWORD }}" \
            --overwrite

      - name: Extract APK
        run: |

          mkdir -p extracted

          unzip -o app.apks universal.apk -d extracted

          test -f extracted/universal.apk

          mv \
            extracted/universal.apk \
            "${{ steps.filename.outputs.APK_NAME }}"

      - name: Verify APK
        run: |

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            "${{ steps.filename.outputs.APK_NAME }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "store-${{ github.run_number }}"
          name: "${{ steps.app.outputs.LABEL }} ${{ github.run_number }}"
          generate_release_notes: false
          files: |
            ${{ steps.filename.outputs.APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: |
          rm -f release.jks
          rm -f bundletool.jar
          rm -f app.apks
          rm -rf extracted
